# pnpm v11 gate for dependency build (postinstall) scripts.
# v11 replaced onlyBuiltDependencies/neverBuiltDependencies with `allowBuilds`
# (a map of package -> true|false). See https://pnpm.io/settings
# true = run its build script. All three are native deps needed by the Angular build.
allowBuilds:
  esbuild: true
  sharp: true
  nice-napi: true
