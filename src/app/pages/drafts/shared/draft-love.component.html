<!-- DESIGN DRAFTS ONLY. Why you'll love Hirably. Animation logic: why-hirably.component.ts -->
<section id="why-hirably" data-section="why_hirably" class="py-20 lg:py-32"
  [ngClass]="variant === 'b' ? 'bg-[#FFFCF5]' : 'bg-white'">
  <div class="mx-auto max-w-[1200px] px-4 sm:px-6 lg:px-8"
    [ngClass]="variant === 'c' ? 'lg:grid lg:grid-cols-[minmax(0,4fr)_minmax(0,8fr)] lg:gap-16 lg:items-start' : ''">

    <div [ngClass]="variant === 'c' ? 'lg:sticky lg:top-28' : variant === 'a' ? 'max-w-[980px]' : 'max-w-[680px]'">
      @if (variant === 'b') {
      <p class="inline-flex items-center rounded-md bg-[#C2E8FF] px-2.5 py-1 text-[13px] font-semibold text-[#102076]">Benefits</p>
      }
      @if (variant === 'c') {
      <p class="font-sans font-extrabold text-[60px] sm:text-[80px] lg:text-[88px] xl:text-[104px] leading-[0.9] tracking-[-0.045em] text-[#102076]">Lifetime</p>
      <p class="mt-3 text-[17px] font-semibold text-[#102076]">replacement guarantee</p>
      }

      <h2 class="font-sans text-[#102076]"
        [ngClass]="variant === 'a' ? 'hbd-oversize font-extrabold'
          : variant === 'b' ? 'mt-4 font-tight font-bold text-[34px] lg:text-[48px] leading-[1.08] tracking-[-0.025em]'
          : 'mt-10 font-extrabold text-[36px] lg:text-[52px] leading-[1.02] tracking-[-0.03em]'">
        Why you'll <span class="relative inline-block">love<!-- Heart pops in on scroll (absolute: no layout shift) --><svg
            #heart aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
            class="absolute -top-[0.28em] -right-[0.4em] w-[0.42em] h-[0.42em] pointer-events-none"
            style="transform-origin: 50% 90%; transform: rotate(12deg);">
            <path fill="none" stroke="#2291EA" stroke-width="2.4" stroke-linejoin="round"
              d="M12 20.3l-1.2-1.1C6.2 15 3.2 12.3 3.2 8.9 3.2 6.2 5.3 4 8 4c1.5 0 3 .7 4 1.9C13 4.7 14.5 4 16 4c2.7 0 4.8 2.2 4.8 4.9 0 3.4-3 6.1-7.6 10.3L12 20.3z" />
          </svg></span> Hirably
      </h2>
      <p class="mt-5 text-[17px] lg:text-[20px] leading-[1.55] text-[#4A5068]" [ngClass]="variant === 'a' ? 'lg:mt-8 max-w-[620px]' : ''">
        {{ subtitleText }}</p>
    </div>

    <div #cardGrid class="grid"
      [ngClass]="variant === 'a' ? 'mt-12 lg:mt-20 gap-5 md:grid-cols-2 lg:grid-cols-3'
        : variant === 'b' ? 'mt-10 lg:mt-14 sm:grid-cols-2 lg:grid-cols-3 rounded-xl border border-[#E8E8E8] bg-white overflow-hidden'
        : 'mt-10 lg:mt-0 gap-4 sm:grid-cols-2'">
      @for (card of loveCards; track card.title; let i = $index) {
      <div data-love-card
        [ngClass]="variant === 'a' ? 'rounded-2xl border border-[#E8E8E8] bg-white p-7 lg:p-9'
          : variant === 'b' ? 'p-6 lg:p-8 border-[#E8E8E8] max-sm:border-b max-sm:last:border-b-0 sm:max-lg:[&:nth-child(-n+4)]:border-b sm:max-lg:odd:border-r lg:[&:nth-child(-n+3)]:border-b lg:[&:not(:nth-child(3n))]:border-r'
          : 'rounded-2xl border border-[#E8E8E8] bg-white p-6 lg:p-7'">
        @if (variant === 'b') {
        <span class="w-11 h-11 rounded-lg bg-[#C2E8FF] text-[#102076] flex items-center justify-center">
          <app-draft-icon [name]="card.icon" class="w-[22px] h-[22px]" /></span>
        } @else {
        <app-draft-icon [name]="card.icon" class="w-8 h-8 text-[#102076]" />
        }
        <h3 class="font-sans text-[#102076]"
          [ngClass]="variant === 'a' ? 'mt-8 font-bold text-[22px] lg:text-[24px] leading-[1.2] tracking-[-0.02em]'
            : variant === 'b' ? 'mt-5 font-tight font-bold text-[19px] leading-[1.25] tracking-[-0.01em]'
            : 'mt-6 font-bold text-[20px] lg:text-[22px] leading-[1.2] tracking-[-0.02em]'">{{ card.title }}</h3>
        <p class="mt-2.5 text-[16px] leading-[1.6] text-[#4A5068]">{{ card.description }}</p>
      </div>
      }
    </div>
  </div>
</section>
