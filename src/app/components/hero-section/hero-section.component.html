<!-- HERO SECTION - -->
<section id="home" data-section="hero" class="relative overflow-hidden">

  <!-- Background Gradient -->
  <div class="absolute inset-0"
    style="background: linear-gradient(180deg, #2291ea 0%, #2291ea 35%, #4691ea 55%, #c7e9f9 80%, #fffbf4 100%);">
  </div>

  <!--  Decorative Shapes (scaled down on mobile) -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">

    <!-- Shape 1: Arriba izquierda -->
    <svg class="absolute top-0 left-0 w-[160px] h-[124px] md:w-[294px] md:h-[228px]" xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 294 228" fill="none">
      <path
        d="M-223.527 -247.349L-241.264 160.263C-241.787 172.724 -237.437 184.667 -229.08 193.876C-220.724 203.085 -209.08 208.489 -196.609 209.044L211.318 227.801C251.068 229.556 284.873 198.75 286.529 159.031L293.034 8.97878C297.507 -93.7522 250.197 -187.131 174.331 -245.816C126.336 -282.942 66.7603 -306.208 1.85244 -309.24L-148.315 -316.12C-188.065 -317.875 -221.87 -287.069 -223.527 -247.349Z"
        fill="#BBE2FD" fill-opacity="0.15" />
    </svg>

    <!-- Shape 2: En medio del texto del hero -->
    <svg
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[285px] md:w-[1274px] md:h-[726px]"
      xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 605" fill="none">
      <path
        d="M1024.7 116.561L553.116 -304.285C538.68 -317.129 520.09 -323.617 500.851 -322.62C481.612 -321.622 463.715 -312.952 450.824 -298.535L28.4471 172.425C-12.6249 218.388 -8.80842 289.139 37.2159 330.062L210.841 484.955C329.693 591.025 488.086 625.809 632.854 592.326C724.437 571.144 810.747 522.486 878.011 447.594L1033.47 274.198C1074.54 228.234 1070.72 157.484 1024.7 116.561Z"
        fill="#BBE2FD" fill-opacity="0.15" />
    </svg>

    <!-- Shape 3: Derecha al centro del hero -->
    <svg class="absolute top-1/4 md:top-[8%] right-0 w-[180px] h-[300px] md:w-[390px] md:h-[657px]"
      xmlns="http://www.w3.org/2000/svg" viewBox="0 0 327 550" fill="none">
      <path
        d="M576.334 444.291L519.444 40.2789C517.686 27.9308 511.231 16.9817 501.335 9.451C491.439 1.92031 479.005 -1.27001 466.642 0.45894L62.1352 56.4037C22.7312 61.9262 -4.88965 98.3801 0.725033 137.736L21.6923 286.458C36.028 388.282 99.5725 471.468 184.868 515.335C238.829 543.085 301.648 555.098 366.02 546.242L514.924 525.623C554.328 520.101 581.949 483.647 576.334 444.291Z"
        fill="#BBE2FD" fill-opacity="0.15" />
    </svg>

  </div>

  <!-- Fade to floral-white at bottom (smooth section transition on mobile/mid) -->
  <div class="absolute bottom-0 left-0 right-0 h-[80px] md:h-[120px] lg:hidden pointer-events-none"
    style="background: linear-gradient(to bottom, transparent, #fffbf4);"></div>

  <div
    class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 relative z-10 pt-[100px] md:pt-[140px] lg:pt-[168px] pb-[40px] md:pb-[60px] lg:pb-[86px]">

    <!-- Hero Content: 2-column layout (text left, form right) -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 items-center">

      <!-- LEFT: Headline -->
      <h1
        class="font-display font-bold text-[32px] md:text-[48px] lg:text-[56px] leading-[120%] text-center lg:text-left order-1">
        <span class="text-white">You Pay Less,</span>
        <span class="text-navy-dark">your People Earn More. Grow your team with Hirably.</span>
      </h1>

      <!-- RIGHT: Book-a-call form card -->
      <div class="order-2 w-full max-w-[440px] mx-auto lg:mx-0 lg:ml-auto">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate
          class="bg-white rounded-2xl shadow-lg p-6 md:p-8 flex flex-col gap-4">

          <p class="font-display font-semibold text-[18px] md:text-[20px] text-navy-dark leading-tight">
            Let's Talk About Your Hiring Needs
          </p>

          <!-- First / Last name -->
          <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1.5">
              <label for="hero-firstName"
                class="font-display font-medium text-[13px] leading-none text-carbon-black">First name</label>
              <input id="hero-firstName" type="text" formControlName="firstName" placeholder="Jane"
                class="w-full h-9 px-3 py-1 rounded-md border font-body text-[14px] text-carbon-black bg-white outline-none transition-colors duration-150 placeholder:text-gray-400 focus:ring-2 focus:ring-offset-1"
                [ngClass]="isInvalid('firstName') ? 'border-red-400 bg-red-50' : 'border-gray-neutral'" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="hero-lastName"
                class="font-display font-medium text-[13px] leading-none text-carbon-black">Last name</label>
              <input id="hero-lastName" type="text" formControlName="lastName" placeholder="Smith"
                class="w-full h-9 px-3 py-1 rounded-md border font-body text-[14px] text-carbon-black bg-white outline-none transition-colors duration-150 placeholder:text-gray-400 focus:ring-2 focus:ring-offset-1"
                [ngClass]="isInvalid('lastName') ? 'border-red-400 bg-red-50' : 'border-gray-neutral'" />
            </div>
          </div>

          <!-- Work email -->
          <div class="flex flex-col gap-1.5">
            <label for="hero-email" class="font-display font-medium text-[13px] leading-none text-carbon-black">Work
              email</label>
            <input id="hero-email" type="email" formControlName="email" placeholder="jane@acme.com"
              class="w-full h-9 px-3 py-1 rounded-md border font-body text-[14px] text-carbon-black bg-white outline-none transition-colors duration-150 placeholder:text-gray-400 focus:ring-2 focus:ring-offset-1"
              [ngClass]="isInvalid('email') ? 'border-red-400 bg-red-50' : 'border-gray-neutral'" />
            @if (isInvalid('email') && form.get('email')?.errors?.['workEmail']) {
            <span role="alert" class="font-body text-[11px] text-red-400">Please use your work email.</span>
            }
          </div>

          <!-- CTA Button (reused) -->
          <button type="submit"
            class="w-full h-[48px] md:h-[52px] flex justify-center items-center bg-bright-amber text-navy-dark font-display font-medium text-[18px] md:text-[20px] leading-normal rounded-[7px] transition-all duration-300 hover:bg-amber-gold hover:scale-[1.02] shadow-lg">
            Book a call
          </button>

          <p class="font-body font-light text-[12px] text-dark-purple/55 text-center leading-relaxed">
            Free 30-minute call. No commitment.
          </p>
        </form>
      </div>

    </div>

    <!-- Discreet tagline below everything -->
    <p
      class="font-body font-light text-[14px] md:text-[16px] leading-relaxed text-white/70 text-center mt-8 md:mt-12 max-w-[640px] mx-auto">
      Grow your company, knowing your people are taken care of.
    </p>

  </div>

</section>
