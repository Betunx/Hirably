<!-- HERO SECTION -->
<section id="home" data-section="hero" class="relative min-h-[92svh] flex items-center"
  style="background: linear-gradient(180deg, #2291ea 0%, #4ba6ee 38%, #bbe2fd 74%, #FFFBF4 100%);">

  <!--  Decorative Shapes (scaled down on mobile). Clipping lives here, not on the section, so the
        calculator's role dropdown can extend past the bottom of the hero. -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">

    <!-- Shape 1: Arriba izquierda -->
    <svg class="absolute top-0 left-0 w-[160px] h-[124px] md:w-[294px] md:h-[228px]" xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 294 228" fill="none">
      <path
        d="M-223.527 -247.349L-241.264 160.263C-241.787 172.724 -237.437 184.667 -229.08 193.876C-220.724 203.085 -209.08 208.489 -196.609 209.044L211.318 227.801C251.068 229.556 284.873 198.75 286.529 159.031L293.034 8.97878C297.507 -93.7522 250.197 -187.131 174.331 -245.816C126.336 -282.942 66.7603 -306.208 1.85244 -309.24L-148.315 -316.12C-188.065 -317.875 -221.87 -287.069 -223.527 -247.349Z"
        fill="#BBE2FD" fill-opacity="0.15" />
    </svg>

    <!-- Shape 2: En medio del texto del hero -->
    <svg
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[285px] md:w-[1274px] md:h-[726px]"
      xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 605" fill="none">
      <path
        d="M1024.7 116.561L553.116 -304.285C538.68 -317.129 520.09 -323.617 500.851 -322.62C481.612 -321.622 463.715 -312.952 450.824 -298.535L28.4471 172.425C-12.6249 218.388 -8.80842 289.139 37.2159 330.062L210.841 484.955C329.693 591.025 488.086 625.809 632.854 592.326C724.437 571.144 810.747 522.486 878.011 447.594L1033.47 274.198C1074.54 228.234 1070.72 157.484 1024.7 116.561Z"
        fill="#BBE2FD" fill-opacity="0.15" />
    </svg>

    <!-- Shape 3: Derecha al centro del hero -->
    <svg class="absolute top-1/4 md:top-[8%] right-0 w-[180px] h-[300px] md:w-[390px] md:h-[657px]"
      xmlns="http://www.w3.org/2000/svg" viewBox="0 0 327 550" fill="none">
      <path
        d="M576.334 444.291L519.444 40.2789C517.686 27.9308 511.231 16.9817 501.335 9.451C491.439 1.92031 479.005 -1.27001 466.642 0.45894L62.1352 56.4037C22.7312 61.9262 -4.88965 98.3801 0.725033 137.736L21.6923 286.458C36.028 388.282 99.5725 471.468 184.868 515.335C238.829 543.085 301.648 555.098 366.02 546.242L514.924 525.623C554.328 520.101 581.949 483.647 576.334 444.291Z"
        fill="#BBE2FD" fill-opacity="0.15" />
    </svg>

  </div>

  <div class="relative z-[5] w-full px-6 md:px-12 pt-[140px] md:pt-[164px] lg:pt-[178px] section-bottom">

    <!-- Hero Content: stacked and centered at every width. Headline, subline and stats on top;
         the rate calculator below (two panes side by side ≥1024px, ~1100px wide). -->
    <div class="max-w-7xl mx-auto flex flex-col items-center gap-10 lg:gap-12">

      <!-- TOP: headline -->
      <div class="w-full">

        <!-- Headline, three lines: "Need a" / [role]? / "try hirably." The role cycles (see component). Sized so the
             longest role fits one line of the text column at every width; each line is one line tall for every
             role, so nothing shifts. Screen readers get one full sentence; the visual lines are aria-hidden. -->
        <div class="hero-headline-box">
          <h1 #rotator class="hero-rotator font-display text-center text-[#102076]">
            <span class="sr-only">{{ spokenHeadline }}</span>
            <span aria-hidden="true" class="block">
              <!-- "Need a" / "Need an": stacked; only fades when the article changes -->
              <span class="grid">
                <span class="hero-line [grid-area:1/1]" [class.is-active]="article() === 'a'">Need a</span>
                <span class="hero-line [grid-area:1/1]" [class.is-active]="article() === 'an'">Need an</span>
              </span>
              <span class="grid">
                @for (role of roles; track role; let i = $index) {
                <span class="hero-line [grid-area:1/1] whitespace-nowrap" [class.is-active]="i === index()"><span class="hero-role">{{ role }}</span>?</span>
                }
              </span>
              <!-- Like the logo wordmark: lowercase, navy, accent period -->
              <span class="block">try hirably<span class="text-primary-blue">.</span></span>
            </span>
          </h1>
        </div>

        <!-- Social proof (centered) -->
        <div
          class="mt-6 lg:mt-8 flex items-center justify-center gap-5 lg:gap-7 flex-wrap lg:flex-nowrap">
          <div class="flex items-center gap-3">
            <div class="flex">
              <div class="w-10 h-10 rounded-full border-[2.5px] border-floral-white bg-bright-amber"></div>
              <div class="w-10 h-10 rounded-full border-[2.5px] border-floral-white bg-green-teal -ml-3"></div>
              <div class="w-10 h-10 rounded-full border-[2.5px] border-floral-white bg-purple-accent -ml-3"></div>
              <div class="w-10 h-10 rounded-full border-[2.5px] border-floral-white bg-primary-blue -ml-3"></div>
            </div>
            <div class="leading-tight">
              <div class="font-body font-bold text-[15px] text-dark-purple">1000s of verified professionals</div>
              <div class="font-body font-medium text-[13px] text-dark-purple/70">across Mexico</div>
            </div>
          </div>

          <div class="w-px h-10 bg-dark-purple/15"></div>

          <div class="leading-tight">
            <div class="font-body font-bold text-[15px] text-dark-purple">Save up to 70%</div>
            <div class="font-body font-medium text-[13px] text-dark-purple/70">vs. local hires</div>
          </div>
        </div>

      </div>

      <!-- BELOW: Rate calculator (460px stacked on phones/tablets; ~1100px with two panes ≥1024px).
           The white card background is drawn inside app-rate-calculator so it can fade in on desktop. -->
      <div class="w-full max-w-[460px] lg:max-w-[1100px] mx-auto p-6 lg:p-10 pb-0 lg:pb-0">
        <app-rate-calculator></app-rate-calculator>
      </div>

    </div>

  </div>

</section>
