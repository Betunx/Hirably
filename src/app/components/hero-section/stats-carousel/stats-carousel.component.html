<!-- Stats Carousel -->
<!-- overflow-hidden and mask-image are on SEPARATE wrappers to avoid GPU compositing conflicts -->
<div class="flex justify-center mb-0">
    <div class="overflow-hidden w-full max-w-[750px]">
        <div
            style="mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);">
            <div class="flex gap-3 md:gap-4 animate-marquee" style="width: max-content;">

                <!-- SET 1 -->
                @for (badge of badges; track badge.highlight) {
                    <ng-container *ngTemplateOutlet="badgeTpl; context: { $implicit: badge }"></ng-container>
                }

                <!-- SET 2 (duplicate for seamless loop; hidden from assistive tech) -->
                @for (badge of badges; track badge.highlight) {
                    <ng-container
                        *ngTemplateOutlet="badgeTpl; context: { $implicit: badge, ariaHidden: true }"></ng-container>
                }

            </div>
        </div>
    </div>
</div>

<!-- Reusable badge -->
<ng-template #badgeTpl let-badge let-ariaHidden="ariaHidden">
    <div [attr.aria-hidden]="ariaHidden"
        class="inline-flex items-center gap-2 md:gap-3 bg-white px-3 md:px-6 py-[6px] md:py-[8px] rounded-[7.5px] shadow-md flex-shrink-0">
        <svg class="flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"
            fill="none" aria-hidden="true">
            <path
                d="M9.02988 0.140015C4.11486 0.140015 0.129883 4.12499 0.129883 9.04002C0.129883 13.955 4.11486 17.94 9.02988 17.94C13.9449 17.94 17.9299 13.955 17.9299 9.04002C17.9299 4.12499 13.9449 0.140015 9.02988 0.140015ZM14.0042 7.33937L8.39724 12.9464C8.25781 13.0858 8.06943 13.1637 7.87288 13.1637C7.67634 13.1637 7.48722 13.0858 7.34853 12.9464L4.78755 10.3854C4.49756 10.0954 4.49756 9.62667 4.78755 9.33668C5.07754 9.04669 5.54628 9.04669 5.83627 9.33668L7.87288 11.3733L12.9555 6.29066C13.2455 6.00067 13.7143 6.00067 14.0042 6.29066C14.2942 6.58065 14.2942 7.04938 14.0042 7.33937Z"
                fill="#FFCF25" />
        </svg>
        <span
            class="font-body font-normal text-[13px] md:text-[16px] leading-normal text-carbon-black whitespace-nowrap">
            @if (badge.prefix) {{{ badge.prefix }} }<span class="font-bold">{{ badge.highlight }}</span>@if (badge.suffix) { {{ badge.suffix }}}
        </span>
    </div>
</ng-template>
