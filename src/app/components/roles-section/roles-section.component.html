<section id="roles" data-section="roles"
  class="py-[64px] lg:py-[120px] overflow-hidden">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-6 min-[1400px]:px-[100px]">

    <!-- Main Grid: 2 columns (text+accordion left, image right) -->
    <div
      class="flex flex-col min-[1400px]:grid min-[1400px]:grid-cols-[1fr_minmax(0,664px)] gap-8 min-[1400px]:gap-12 items-start">

      <!-- Left Column: Title + Subtitle + Accordion -->
      <!-- max-w constrains content at intermediate widths (1024–1400px) where layout is still single-col -->
      <div class="order-1 min-[1400px]:order-none max-w-[650px] min-[1400px]:max-w-none mx-auto min-[1400px]:mx-0">

        <!-- Mobile Image: visible below 1400px -->
        <div class="flex min-[1400px]:hidden items-center justify-center mb-8">
          <img src="assets/img/man2.webp" alt="World-class talent"
            class="h-auto max-h-[300px] md:max-h-[420px] object-contain" loading="lazy">
        </div>

        <!-- Header — centered on mobile, left on desktop -->
        <h2
          class="font-display text-[32px] md:text-[44px] min-[1400px]:text-[54px] leading-[120%] min-[1400px]:leading-[64px] text-navy-dark mb-4 text-center min-[1400px]:text-left">
          <span class="font-medium">World-Class Talent</span><br>
          <span class="font-normal">Across All Functions</span>
        </h2>
        <!-- Subtitle — centered on mobile, left on desktop -->
        <p
          class="font-body font-light text-[16px] min-[1400px]:text-[20px] leading-[24px] min-[1400px]:leading-[28px] text-dark-purple mb-5 min-[1400px]:mb-10 text-center min-[1400px]:text-left">
          Each role supported by an industry-specialist recruiter.
        </p>

        <!-- Accordion - full column width, blue #2291EA dividers -->
        @for (category of categories; track category.id; let first = $first) {
        <div>
          <!-- Top divider (only first item) -->
          @if (first) {
          <div class="h-px bg-primary-blue w-full"></div>
          }
          <!-- Category row -->
          <div class="py-[9px] min-[1400px]:py-[13px]">
            <button (click)="toggleAccordion(category.id)" class="w-full flex items-center justify-between text-left">
              <!-- Category title + roles link -->
              <span class="flex items-center gap-2">
                <span
                  class="font-display font-medium text-[16px] min-[1400px]:text-[24px] leading-[120%] text-primary-blue">{{
                  category.title }}</span>
                @if (deptIds.has(category.id)) {
                <span role="link" tabindex="0" (click)="$event.stopPropagation(); onRoleClick(category.id)"
                  (keydown.enter)="$event.stopPropagation(); onRoleClick(category.id)"
                  (keydown.space)="$event.preventDefault(); $event.stopPropagation(); onRoleClick(category.id)"
                  class="inline-flex items-center gap-0.5 font-body text-[11px] text-primary-blue/60 hover:text-primary-blue transition-colors cursor-pointer">
                  roles
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                  </svg>
                </span>
                }
              </span>
              <!-- "+" icon -->
              <svg class="flex-shrink-0 transition-transform duration-300"
                [class.rotate-45]="expandedSection === category.id" width="14" height="14" viewBox="0 0 17 17"
                fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="8.5" y1="0" x2="8.5" y2="17" stroke="#2291EA" stroke-width="3" />
                <line x1="17" y1="8.5" x2="0" y2="8.5" stroke="#2291EA" stroke-width="3" />
              </svg>
            </button>
            <!-- Expanded roles -->
            <div class="overflow-hidden transition-all duration-300 ease-in-out"
              [class.max-h-0]="expandedSection !== category.id" [class.max-h-96]="expandedSection === category.id"
              [class.opacity-0]="expandedSection !== category.id" [class.opacity-100]="expandedSection === category.id">
              <div class="pt-2 pb-1">
                <div class="flex flex-wrap gap-[7px] min-[1400px]:gap-[10px]">
                  @for (role of category.roles; track role) {
                  <span [attr.role]="deptIds.has(category.id) ? 'button' : null"
                    [attr.tabindex]="deptIds.has(category.id) ? 0 : null" (click)="onRoleClick(category.id)"
                    (keydown.enter)="onRoleClick(category.id)"
                    (keydown.space)="$event.preventDefault(); onRoleClick(category.id)"
                    [class.cursor-pointer]="deptIds.has(category.id)"
                    [class.hover:bg-primary-blue]="deptIds.has(category.id)"
                    [class.hover:text-white]="deptIds.has(category.id)"
                    class="px-[10px] min-[1400px]:px-[17px] py-[5px] min-[1400px]:py-[9px] bg-white border border-light-sky rounded-lg font-body font-normal text-[12px] min-[1400px]:text-[16px] text-carbon-black transition-colors">
                    {{ role }}
                  </span>
                  }
                </div>
              </div>
            </div>
          </div>
          <!-- Bottom divider -->
          <div class="h-px bg-primary-blue w-full"></div>
        </div>
        }
      </div>

      <!-- Right Column: Image (desktop only) - Figma: 664×583 -->
      <div class="hidden min-[1400px]:flex items-center justify-center">
        <img src="assets/img/man2.webp" alt="World-class talent" class="w-full max-w-[664px] h-auto object-contain"
          loading="lazy">
      </div>

    </div>

  </div>
</section>
